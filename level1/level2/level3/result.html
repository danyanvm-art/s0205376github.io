<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Параметры URL</title>
</head>
<body>
    <h1>Параметры URL</h1>

    <div id="output"></div>

    <p><a href="fff.html">← Вернуться на главную</a></p>

    <script>
        var params = new URLSearchParams(window.location.search);
        var output = document.getElementById("output");

        var name = params.get("name");
        var age = params.get("age");
        var city = params.get("city");
        var id = params.get("id");

        if (name !== null) output.innerHTML += "<p><b>name:</b> " + name + "</p>";
        if (age !== null) output.innerHTML += "<p><b>age:</b> " + age + "</p>";
        if (city !== null) output.innerHTML += "<p><b>city:</b> " + city + "</p>";
        if (id !== null) output.innerHTML += "<p><b>id:</b> " + id + "</p>";
    </script>
</body>
</html>
